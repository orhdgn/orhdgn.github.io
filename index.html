<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Orhun Doğan</title>
<meta name="description" content="Apps by Orhun Doğan.">
<style>
:root {
  --bg: #F6F1EA; --card: #FFFFFF; --ink: #2B1D14; --ink2: #5A3825;
  --muted: #7E6757; --accent: #C65F3A;
  --shadow: 0 1px 2px rgba(90, 56, 37, .08), 0 6px 18px rgba(90, 56, 37, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1B1410; --card: #271D17; --ink: #F3E7D7; --ink2: #D9C3A8;
    --muted: #A88F7A; --accent: #E0855A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink2);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 680px; margin: 0 auto; padding: 72px 16px 56px; }
h1 {
  margin: 0; color: var(--ink); font-weight: 600; font-size: 34px; line-height: 1.15;
  font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
h2 {
  margin: 36px 4px 10px; color: var(--muted);
  font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.app {
  display: flex; align-items: center; gap: 16px; padding: 16px 20px;
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
  color: var(--ink2); text-decoration: none;
}
.app + .app { margin-top: 12px; }
.app img { flex: none; border-radius: 13px; }
.app .text { flex: 1; min-width: 0; font-size: 15px; line-height: 1.5; }
.app strong { display: block; color: var(--ink); font-size: 17px; font-weight: 600; }
.app svg {
  flex: none; width: 20px; height: 20px; color: var(--muted);
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
<h1>Orhun Doğan</h1>
<h2>Apps</h2>
<!-- One <a class="app"> per app; each app's pages are in its own folder. -->
<a class="app" href="bookwood/">
<img src="bookwood/icon.svg" alt="" width="56" height="56">
<span class="text"><strong>Bookwood</strong>Your home library and e-books on your phone, with no account and no server.</span>
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg>
</a>
</main>
</body>
</html>
