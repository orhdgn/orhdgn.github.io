<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Orhun Doğan</title>
<meta name="description" content="Apps by Orhun Doğan.">
<link rel="icon" href="bookwood/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="bookwood/icon-512.png">
<style>:root {
  --bg: #F6F1EA; --card: #FFFFFF; --ink: #2B1D14; --ink2: #5A3825;
  --muted: #7E6757; --accent: #C65F3A; --accent-text: #B34E29;
  --track: #E7DCCD; --chip: rgba(198, 95, 58, .12);
  --shadow: 0 1px 2px rgba(90, 56, 37, .08), 0 6px 18px rgba(90, 56, 37, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1B1410; --card: #271D17; --ink: #F3E7D7; --ink2: #D9C3A8;
    --muted: #A88F7A; --accent: #E0855A; --accent-text: #E0855A;
    --track: #3A2C22; --chip: rgba(224, 133, 90, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink2);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--accent-text); }
svg {
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 56px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--ink); font-weight: 600; font-size: 17px; text-decoration: none;
}
.brand img { border-radius: 9px; }
.lang { position: relative; }
.lang summary {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  list-style: none; padding: 8px 14px; border-radius: 999px;
  background: var(--card); box-shadow: var(--shadow); color: var(--ink); font-size: 14px;
}
.lang summary::-webkit-details-marker { display: none; }
.lang summary svg { width: 18px; height: 18px; }
.lang ul {
  position: absolute; inset-inline-end: 0; top: calc(100% + 8px); z-index: 1;
  display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: min(340px, calc(100vw - 32px));
  margin: 0; padding: 6px; list-style: none;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
}
.lang li a {
  display: block; padding: 7px 12px; border-radius: 10px;
  color: var(--ink); text-decoration: none;
}
.lang li a:hover { background: var(--chip); }
.lang li a[aria-current] { color: var(--accent-text); font-weight: 600; }
.kicker {
  margin: 44px 0 8px; color: var(--accent-text);
  font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.headline {
  margin: 0; color: var(--ink); font-weight: 600; font-size: 34px; line-height: 1.15;
  font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
.lead { margin: 12px 0 0; font-size: 17px; }
.headline { text-wrap: balance; }
html[lang=ja] .headline { word-break: auto-phrase; }
.lead, .fact p, .qa p, footer p { text-wrap: pretty; }
h2 {
  margin: 36px 4px 10px; color: var(--muted);
  font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
html:is([lang=ar], [lang=hi], [lang=th], [lang=ja], [lang=ko], [lang^=zh]) :is(h2, .kicker) {
  letter-spacing: 0;
}
/* Korecede satır sözcük arasında kırılır, hece arasında değil. */
html[lang=ko] body { word-break: keep-all; }
.card { display: block; background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 4px 0; }
.card.solo, .card.contact { margin-top: 14px; }
.fact { display: flex; gap: 14px; padding: 0 20px; }
.icon {
  flex: none; display: grid; place-items: center; width: 38px; height: 38px;
  border-radius: 50%; background: var(--chip); color: var(--accent-text);
}
.icon svg { width: 20px; height: 20px; }
.fact .icon { margin-top: 16px; }
.fact .text { flex: 1; min-width: 0; padding: 16px 0; }
.fact + .fact .text { border-top: 1px solid var(--track); }
h3 { margin: 0 0 4px; color: var(--ink); font-size: 16px; font-weight: 600; line-height: 1.35; }
.fact p { margin: 0; font-size: 15px; line-height: 1.55; }
.more-links { display: flex; flex-wrap: wrap; gap: 0 20px; }
.more {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
  font-weight: 600; font-size: 15px; text-decoration: none;
}
.more:hover { text-decoration: underline; }
.more svg { width: 16px; height: 16px; }
[dir=rtl] :is(.ext, .fwd) { transform: scaleX(-1); }
.qa summary {
  display: flex; gap: 14px; padding: 0 20px; cursor: pointer; list-style: none;
}
.qa summary::-webkit-details-marker { display: none; }
.qa .icon { margin-top: 14px; }
.qa .row { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 10px; padding: 14px 0; }
.qa + .qa .row { border-top: 1px solid var(--track); }
.qa .q { flex: 1; min-width: 0; margin-top: 8px; color: var(--ink); font-weight: 600; line-height: 1.35; }
.chev { flex: none; width: 22px; height: 22px; margin-top: 7px; color: var(--muted); transition: transform .2s ease; }
.qa[open] .chev { transform: rotate(180deg); }
.qa p { margin: -6px 0 0; padding: 0 52px 18px 72px; font-size: 15px; line-height: 1.55; }
[dir=rtl] .qa p { padding: 0 72px 18px 52px; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
.contact {
  display: flex; align-items: center; gap: 14px; padding: 16px 20px;
  color: var(--ink2); text-decoration: none;
}
.contact .text { flex: 1; min-width: 0; }
.contact strong { display: block; color: var(--ink); font-weight: 600; }
.contact .address { overflow-wrap: anywhere; }
.contact .ext { flex: none; width: 20px; height: 20px; color: var(--muted); }
footer { margin: 32px 4px 0; padding-top: 18px; border-top: 1px solid var(--track); color: var(--muted); font-size: 14px; }
footer p { margin: 0 0 4px; }
.documents { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 14px; }
.documents a { color: var(--ink2); font-weight: 600; text-decoration: none; }
.documents a:hover { text-decoration: underline; }
.documents a[aria-current] { color: var(--accent-text); }
.landing { text-align: center; padding-top: 72px; }
.appicon { border-radius: 26px; box-shadow: var(--shadow); }
.landing .headline { margin-top: 24px; font-size: 40px; }
.landing .lead { max-width: 30em; margin-inline: auto; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
.links a {
  padding: 10px 18px; border-radius: 999px; background: var(--card);
  box-shadow: var(--shadow); font-weight: 600; text-decoration: none;
}
@media (max-width: 420px) {
  .headline { font-size: 29px; }
  .fact, .qa summary { padding: 0 16px; }
  .qa p { padding: 0 48px 18px 68px; }
  [dir=rtl] .qa p { padding: 0 68px 18px 48px; }
  .contact { padding: 16px; }
}
</style>
</head>
<body>
<main class="wrap landing">
<h1 class="headline">Orhun Doğan</h1>
<p class="lead">Apps</p>
<nav class="links">
<a href="bookwood/"><img src="bookwood/icon.svg" alt="" width="28" height="28" style="vertical-align:middle;margin-right:8px">Bookwood</a>
</nav>
</main>
</body>
</html>
